name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Phase 2 (DND-2.1+): GitHub CI is the authoritative merge safety gate.
# Local Sprint Final Quality Gate and CI must remain materially aligned.
# Absolute hardware-specific benchmark timings are NOT CI thresholds.

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and packed-consumer validation
        run: pnpm test:pack

      - name: Build playground and examples
        run: |
          pnpm --filter @dndgem/playground build
          pnpm --filter @dndgem/example-react build
          pnpm --filter @dndgem/example-vanilla build

      - name: Benchmark semantics
        run: pnpm bench:core:semantics

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Playground Vite resolves workspace packages from dist.
      - name: Build packages
        run: pnpm --filter "./packages/**" build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium e2e
        run: pnpm test:e2e
