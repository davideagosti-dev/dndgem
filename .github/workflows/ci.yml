name: CI

# Promotion / reusable quality gate (DND-2.3 / DND-2.4):
# - Automatic full CI: develop → master pull requests only
# - Feature → develop: no GitHub CI (local Sprint Final Quality Gate is mandatory)
# - Reusable via workflow_call (publish pipeline)
# - Optional manual runs via workflow_dispatch
# - browser-e2e runs the Alpha desktop engine matrix: Chromium, Firefox, WebKit
#
# Absolute hardware-specific benchmark timings are NOT CI thresholds.

on:
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub filters pull_request.branches by BASE. Enforce HEAD == develop so
  # accidental feature → master PRs are not treated as the promotion path.
  promote-gate:
    name: promote-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require develop head for master PRs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Full CI runs only for develop → master promotion PRs (head was '$HEAD_REF')."
            echo "Feature work merges to develop without GitHub CI; run the local Sprint Final Quality Gate instead."
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Soft dependency: skipped promote-gate must not block workflow_call / dispatch.
    needs: [promote-gate]
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_call' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.promote-gate.result == 'success')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and packed-consumer validation
        run: pnpm test:pack

      - name: Build playground, www, and examples
        run: |
          pnpm --filter @dndgem/playground build
          pnpm --filter @dndgem/www build
          pnpm --filter @dndgem/example-react build
          pnpm --filter @dndgem/example-vanilla build

      - name: Documentation links
        run: pnpm check:docs-links

      - name: Benchmark semantics
        run: pnpm bench:core:semantics

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Playground Vite resolves workspace packages from dist.
      - name: Build packages
        run: pnpm --filter "./packages/**" build

      - name: Install Playwright browsers (Alpha matrix)
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser e2e (Chromium, Firefox, WebKit)
        run: pnpm test:e2e
