name: Publish

# Controlled Alpha publish path. Never runs on push.
# Default is dry-run. Actual npm publish requires:
#   - package versions already bumped off 0.0.0 via Changesets
#   - dispatch from master (enforced below for non-dry-run)
#   - npm Trusted Publisher configured for publish.yml on each @dndgem/* package
#   - GitHub Actions OIDC (id-token: write) — primary auth
# Do not use dist-tag latest for Alpha.
#
# NPM_TOKEN: LEGACY FALLBACK — PENDING VERIFIED OIDC RELEASE
# Do not use NPM_TOKEN on the primary publish path. Retain the GitHub secret
# until a legitimate non-dry-run OIDC publish succeeds; then revoke it.
# The repair workflow may still need a write token for non-publish admin ops.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and dry-run publish without uploading to npm
        type: boolean
        default: true
      dist_tag:
        description: npm dist-tag (Alpha must use alpha, not latest)
        type: string
        default: alpha
      allow_latest:
        description: Permit dist-tag latest (forbidden for Alpha)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    permissions:
      contents: read
      # Required for npm Trusted Publishing (GitHub OIDC → short-lived publish token).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted Publishing requires Node >= 22.14.0 and npm CLI >= 11.5.1.
          # Node 24 ships a compatible npm; we still pin/verify npm explicitly below.
          # Do NOT set registry-url: setup-node would write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into NPM_CONFIG_USERCONFIG
          # and export NODE_AUTH_TOKEN, which prevents npm from performing the OIDC exchange
          # (E404 / ENEEDAUTH). See actions/setup-node#1551 and npm/cli Trusted Publishing docs.
          node-version: 24
          cache: pnpm

      - name: Ensure npm CLI for Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version
          node -e "
            const [maj, min, patch] = process.versions.node.split('.').map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error('Node must be >= 22.14.0 for npm Trusted Publishing');
              process.exit(1);
            }
            const npmVer = require('child_process').execSync('npm --version', { encoding: 'utf8' }).trim();
            const [nMaj, nMin, nPatch] = npmVer.split('.').map(Number);
            if (nMaj < 11 || (nMaj === 11 && nMin < 5) || (nMaj === 11 && nMin === 5 && nPatch < 1)) {
              console.error('npm CLI must be >= 11.5.1 for Trusted Publishing; got', npmVer);
              process.exit(1);
            }
            console.log('Trusted Publishing toolchain OK: node', process.versions.node, 'npm', npmVer);
          "

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Guard dist-tag
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          ALLOW_LATEST: ${{ inputs.allow_latest }}
        run: |
          if [ "$DIST_TAG" = "latest" ] && [ "$ALLOW_LATEST" != "true" ]; then
            echo "Refusing to publish with dist-tag latest. Alpha uses alpha."
            exit 1
          fi

      - name: Guard master for real publish
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "Refusing non-dry-run publish from '$REF'. Real publication must run on master."
            exit 1
          fi

      - name: Build packages
        run: pnpm --filter "./packages/**" build

      - name: Pack validation
        run: pnpm test:pack

      - name: Dry-run publish
        run: |
          # Dry-run validates pack/manifest safety only. It does not exercise
          # npm Trusted Publishing / OIDC authentication against the registry.
          pnpm --filter @dndgem/core publish --dry-run --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/dom publish --dry-run --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/react publish --dry-run --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/vue publish --dry-run --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/angular publish --dry-run --no-git-checks --tag "${{ inputs.dist_tag }}" --access public

      - name: Refuse unversioned public publish
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          for (const name of ['core', 'dom', 'react']) {
            const version = JSON.parse(readFileSync('packages/' + name + '/package.json', 'utf8')).version;
            if (version === '0.0.0') {
              console.error(name + ' is still 0.0.0. Run changeset version before a real publish.');
              process.exit(1);
            }
          }
          "

      - name: Prepare OIDC publish environment
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        # Strip any residual classic-token npmrc / env so npm uses GitHub OIDC.
        # Print only presence booleans — never secret values.
        run: |
          if [ -n "${NODE_AUTH_TOKEN+x}" ] && [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "NODE_AUTH_TOKEN present: YES (will unset for OIDC)"
          else
            echo "NODE_AUTH_TOKEN present: NO"
          fi
          if [ -n "${NPM_TOKEN+x}" ] && [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN present: YES (unexpected on OIDC path — failing)"
            exit 1
          else
            echo "NPM_TOKEN present: NO"
          fi
          unset NODE_AUTH_TOKEN || true
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            if grep -E '_authToken|always-auth' "${NPM_CONFIG_USERCONFIG}" >/dev/null 2>&1; then
              echo "Sanitizing classic auth lines from NPM_CONFIG_USERCONFIG"
              sed -i '/_authToken/d;/^always-auth=/d' "${NPM_CONFIG_USERCONFIG}"
            else
              echo "NPM_CONFIG_USERCONFIG has no classic auth lines"
            fi
          else
            echo "NPM_CONFIG_USERCONFIG unset or missing (OK for OIDC)"
          fi

      - name: Publish to npm (OIDC Trusted Publishing)
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        # No NODE_AUTH_TOKEN / NPM_TOKEN — pnpm publish packs then invokes npm publish,
        # which exchanges the GitHub OIDC token via the configured Trusted Publisher.
        # Do not pass --provenance: repository is PRIVATE; provenance is unavailable.
        # DND-FX.1: add --filter lines only when the adapter package exists.
        # DND-FX.6: Trusted Publisher + first real OIDC publish for new adapters.
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          pnpm --filter @dndgem/core publish --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/dom publish --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          pnpm --filter @dndgem/react publish --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          # @dndgem/vue and @dndgem/angular are in-repo but unversioned (0.0.0) until DND-FX.6.
          # Trusted Publisher for these packages is not configured in DND-FX.2 / DND-FX.3.
          VUE_VERSION="$(node -p "require('./packages/vue/package.json').version")"
          if [ "$VUE_VERSION" != "0.0.0" ]; then
            pnpm --filter @dndgem/vue publish --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          else
            echo "Skipping @dndgem/vue real publish (version 0.0.0; deferred to DND-FX.6)"
          fi
          ANGULAR_VERSION="$(node -p "require('./packages/angular/package.json').version")"
          if [ "$ANGULAR_VERSION" != "0.0.0" ]; then
            pnpm --filter @dndgem/angular publish --no-git-checks --tag "${{ inputs.dist_tag }}" --access public
          else
            echo "Skipping @dndgem/angular real publish (version 0.0.0; deferred to DND-FX.6)"
          fi
